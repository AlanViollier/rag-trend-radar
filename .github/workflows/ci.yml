name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ## No `name:` on purpose: GitHub reports the job under its name, and `make protect`
  ## requires a check called "check".
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      ## setup-uv publishes no major tag; pin the release and the uv version.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.9.27"
          enable-cache: true

      ## Python comes from .python-version; the dev group installs by default.
      - run: uv sync --locked

      ## Every pre-commit hook, so a commit made with --no-verify still gets checked.
      - run: uv run pre-commit run --all-files --show-diff-on-failure

      ## Needs network, so it stays out of `make check`.
      - run: uv run pip-audit --skip-editable
